<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101012">
  <script src="/js/theme-boot.js"></script>
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Surveille ton usage de Claude depuis ton téléphone, chiffré de bout en bout.">
  <title>Claude Usage</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/charts.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Claude Usage</h1>
      <div class="sync" id="sync" role="status" aria-live="polite"></div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Actualiser" hidden></button>
  </header>
  <main id="app"><p class="muted">Chargement…</p></main>
  <nav class="nav" id="nav" aria-label="Navigation principale" hidden>
    <div class="nav-inner">
      <button data-tab="home" data-icon="home" aria-label="Accueil"><span>Accueil</span></button>
      <button data-tab="stats" data-icon="stats" aria-label="Statistiques"><span>Statistiques</span></button>
      <button data-tab="settings" data-icon="settings" aria-label="Réglages"><span>Réglages</span></button>
    </div>
  </nav>
  <noscript><p class="muted">Cette application a besoin de JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
